name: Update Room Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 1 * *'

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Rebuild data/rooms.json
        run: python scripts/build_catalog.py

      - name: Commit updated catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rooms.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update TUM room catalog"
            git push
          else
            echo "No catalog changes."
          fi
